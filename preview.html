<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Obra — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PALETA (a sua) + cores semânticas derivadas dela
   ========================================================= */
:root{
  --terracota:#A65A3A;      /* principal: botões, item ativo, barras */
  --terracota-esc:#8A4529;
  --cafe:#3B2A22;           /* texto e faixas escuras */
  --creme:#FAF6F2;          /* fundo */
  --ambar:#E0A458;          /* atenção */
  --vermelho:#C0392B;       /* atrasado / crítico */

  --ok:#4E7A3A;  --ok-bg:#E5EEDC;                  /* verde oliva, no tom quente da paleta */
  --at:#E0A458;  --at-bg:#FBEBD2; --at-tx:#7A4A10;  /* âmbar: texto escurecido p/ ler no sol */
  --cr:#C0392B;  --cr-bg:#FBE7E4;

  --branco:#FFFFFF;
  --linha:#E3D8CE;
  --apagado:#6B5549;
  --cafe-2:#4E3A30;
  --cafe-claro:#D9C7BA;
  --terra-bg:#F4E8E0;

  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--cafe);font-family:var(--sans);font-size:16px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.lab{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado)}
.mono{font-family:var(--mono)}
.muted{color:var(--apagado)}
.cr-tx{color:var(--cr)} .ok-tx{color:var(--ok)} .at-tx{color:var(--at-tx)}

/* ===================== ESQUELETO ===================== */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:92px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--branco);border-top:1px solid var(--linha);
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12px;font-weight:600;color:var(--apagado);border-radius:var(--r);position:relative}
.bnav button.on{color:var(--terracota)}
.bnav button.on::before{content:"";position:absolute;top:-5px;left:22%;right:22%;height:3px;background:var(--terracota);border-radius:0 0 3px 3px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--cr);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:240px;flex:none;background:var(--cafe);color:var(--creme);
    position:sticky;top:0;height:100vh;padding:20px 12px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:700;font-size:19px}
  .brand i{width:22px;height:22px;border-radius:5px;background:var(--terracota)}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:var(--r);
    font-size:15px;font-weight:500;color:var(--cafe-claro);text-align:left;position:relative}
  .side nav button:hover{background:var(--cafe-2);color:var(--creme)}
  .side nav button.on{background:var(--terracota);color:#fff;font-weight:600}
  .side nav .badge{position:static;margin-left:auto}
  .side .me{margin-top:auto;border-top:1px solid var(--cafe-2);padding:14px 4px 0;font-size:14px}
  .side .me .lab{color:var(--cafe-claro);margin:0 6px 8px}
  .side .who-sw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--cafe-2);padding:4px;border-radius:8px}
  .side .who-sw button{min-height:44px;border-radius:6px;font-size:14px;font-weight:600;color:var(--cafe-claro)}
  .side .who-sw button.on{background:var(--creme);color:var(--cafe)}
  .bnav{display:none}
  .main{padding-bottom:40px}
}

/* ===================== FAIXA DO TOPO ===================== */
.hd{background:var(--cafe);color:var(--creme)}
.hd-in{max-width:1180px;margin:0 auto;padding:16px 16px 0}
.hd-row{display:flex;align-items:center;gap:12px;min-height:48px}
.hd h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hd .sub{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--cafe-claro);margin-top:3px;text-transform:uppercase}
.hd .push{margin-left:auto}
.back{width:44px;height:44px;border-radius:var(--r);display:grid;place-items:center;background:var(--cafe-2);flex:none;color:var(--creme)}
.hd .date{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ambar);text-transform:uppercase;padding-bottom:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--cafe-claro);
  min-height:48px;padding:0 11px;white-space:nowrap;border-bottom:3px solid transparent;position:relative}
.tabs button.on{color:var(--ambar);border-bottom-color:var(--ambar)}
.tabs .dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--ambar);color:var(--cafe);font-size:11px;line-height:18px;text-align:center;margin-left:6px;padding:0 4px}
.tabs .sep{width:1px;background:var(--cafe-2);margin:12px 6px;flex:none}
.hd-pad{height:16px}

/* ===================== CONTEÚDO ===================== */
.ct{max-width:1180px;margin:0 auto;padding:12px 12px 0;display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.ct{padding:24px 24px 0;gap:16px}.hd-in{padding:22px 24px 0}.tabs{margin:14px -24px 0;padding:0 24px}}

.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r)}
.pad{padding:14px}
.col{display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.col{gap:16px}}

.btn{min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--terracota);color:#fff}
.btn.pri:active{background:var(--terracota-esc)}
.btn.sec{background:var(--branco);color:var(--terracota);border:2px solid var(--terracota)}
.btn.esc{background:var(--cafe-2);color:var(--creme)}
.btn.okb{background:var(--ok);color:#fff}
.btn.wa{background:var(--branco);color:var(--ok);border:2px solid var(--ok)}
.btn.full{width:100%}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn svg.i{width:20px;height:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr);gap:12px}.kpis.k3{grid-template-columns:repeat(3,1fr)}}
.kpi{padding:12px 14px 14px;border-top:5px solid var(--cafe);text-align:left;width:100%}
.kpi.t{border-top-color:var(--terracota)} .kpi.ok{border-top-color:var(--ok)} .kpi.at{border-top-color:var(--at)} .kpi.cr{border-top-color:var(--cr)}
.kpi .n{display:block;white-space:nowrap;font-size:clamp(26px,7.4vw,34px);font-weight:700;line-height:1.05;margin-top:6px;letter-spacing:-.02em}
.kpi .n small{font-size:16px;font-weight:600;letter-spacing:0;margin-right:2px}
.kpi.cr .n{color:var(--cr)} .kpi.ok .n.g{color:var(--ok)}
.kpi .d{font-size:14px;color:var(--apagado);margin-top:4px}
.kpi.cr .d{color:var(--cr);font-weight:600}

.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 8px;border-radius:4px;white-space:nowrap;line-height:1}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.at{background:var(--at-bg);color:var(--at-tx)}
.tag.cr{background:var(--cr);color:#fff}
.tag.cr::before{background:#fff}
.tag.ne{background:#F1EAE3;color:var(--apagado)}
.tag.plain::before{display:none}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:var(--r);font-weight:600;text-align:left;width:100%;border-left:6px solid}
.alert.cr{background:var(--cr-bg);border-color:var(--cr);color:#8E2318}
.alert.at{background:var(--at-bg);border-color:var(--at);color:var(--at-tx)}
.alert.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.alert .go{margin-left:auto;white-space:nowrap;font-family:var(--mono);font-size:13px;letter-spacing:.06em}
.alert small{display:block;font-weight:500;font-size:14px;margin-top:2px}

.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--linha);background:var(--branco);font-weight:600;font-size:15px;white-space:nowrap;color:var(--cafe)}
.seg button.on{background:var(--cafe);border-color:var(--cafe);color:var(--creme)}
.seg button .c{font-family:var(--mono);font-size:12px;margin-left:6px;opacity:.75}
.seg.big button{min-height:52px;font-size:16px;flex:1}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;flex-wrap:wrap}
.h2{font-size:19px;font-weight:700}

/* cartões de obra */
.obras{display:grid;gap:10px}
@media (min-width:700px){.obras{grid-template-columns:1fr 1fr;gap:14px}}
@media (min-width:1200px){.obras{grid-template-columns:repeat(3,1fr)}}
.obra{text-align:left;width:100%;border-top:5px solid var(--ok);display:flex;flex-direction:column}
.obra.cr{border-top-color:var(--cr)} .obra.at{border-top-color:var(--at)} .obra.ne{border-top-color:#B8A79A}
.obra .top{padding:14px 14px 10px;display:flex;gap:10px;align-items:flex-start}
.obra .nm{font-size:19px;font-weight:700;line-height:1.2}
.obra .og{font-size:14px;color:var(--apagado);margin-top:3px}
.obra .top .tag{margin-left:auto;flex:none}
.obra .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--linha);margin-top:auto}
.obra .stats>div{padding:10px 12px 12px;border-left:1px solid var(--linha)}
.obra .stats>div:first-child{border-left:0}
.obra .stats b{display:block;white-space:nowrap;font-size:clamp(19px,5.6vw,24px);font-weight:700;line-height:1.1;margin-top:4px;letter-spacing:-.01em}
.obra .stats b small{font-size:13px;font-weight:600}
.obra .stats b.cr{color:var(--cr)} .obra .stats b.ok{color:var(--ok)}
.obra .stats .s{font-size:13px;color:var(--apagado);margin-top:2px}
.obra .stats .s.cr{color:var(--cr);font-weight:600}
.obra .stats .s.ok{color:var(--ok);font-weight:600}

/* listas */
.list .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--linha);min-height:64px;width:100%;text-align:left}
.list .row:first-child{border-top:0}
.list .row.cr{background:var(--cr-bg)}
.list .row.at{background:#FDF5EA}
.row .tx{flex:1;min-width:0}
.row .tt{font-size:16px;font-weight:600;line-height:1.3}
.row .mt{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--apagado);margin-top:3px;text-transform:uppercase}
.row .val{font-size:17px;font-weight:700;white-space:nowrap;text-align:right}
.row .val .tag{margin-top:6px}
.list-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.list-h .nm{font-size:18px;font-weight:700}
.list-h .tot{margin-left:auto;text-align:right}
.list-h .tot b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.list-f{padding:10px 14px 14px;border-top:1px solid var(--linha)}
.list-t{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-top:2px solid var(--cafe);font-weight:700;font-size:18px;background:#FBF8F5}

.grid2{display:grid;gap:10px}
@media (min-width:900px){.grid2{grid-template-columns:1fr 1fr;gap:16px;align-items:start}}
.prog{height:12px;background:#F0E7DF;border-radius:6px;overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;background:var(--terracota);border-radius:6px}
.prog.at i{background:var(--at)} .prog.ok i{background:var(--ok)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bar .l{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:500}
.bar .l b{font-weight:700;white-space:nowrap}
.bar .tr{height:12px;background:#F3ECE5;border-radius:3px;margin-top:5px}
.bar .tr i{display:block;height:100%;background:var(--terracota);border-radius:3px}
.bar .sub{font-family:var(--mono);font-size:12px;color:var(--apagado);margin-top:4px}

/* módulos da obra (atalhos no Resumo) */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:700px){.mods{grid-template-columns:repeat(4,1fr);gap:12px}}
.mod{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;min-height:112px;text-align:left;width:100%;border-left:5px solid var(--terracota)}
.mod.at{border-left-color:var(--at)} .mod.cr{border-left-color:var(--cr)} .mod.ok{border-left-color:var(--ok)}
.mod .mi{width:40px;height:40px;border-radius:8px;background:var(--terra-bg);color:var(--terracota);display:grid;place-items:center}
.mod b{font-size:16px}
.mod span{font-size:14px;color:var(--apagado);line-height:1.3}
.mod.at span{color:var(--at-tx);font-weight:600} .mod.cr span{color:var(--cr);font-weight:600}

/* dados da obra */
.dl{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:700px){.dl{grid-template-columns:1fr 1fr}}
.dl>div{padding:12px 14px;border-top:1px solid var(--linha)}
.dl>div:first-child{border-top:0}
@media (min-width:700px){.dl>div:nth-child(2){border-top:0}.dl>div:nth-child(even){border-left:1px solid var(--linha)}}
.dl b{display:block;font-size:17px;font-weight:600;margin-top:4px}

/* tabelas (orçamento / folha) */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado);text-align:left;padding:10px 14px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{border-top:2px solid var(--cafe);font-weight:700;font-size:17px;background:#FBF8F5}
.tbl .mini{height:8px;background:#F0E7DF;border-radius:4px;margin-top:6px;overflow:hidden}
.tbl .mini i{display:block;height:100%;background:var(--terracota)}
@media (max-width:699px){
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--linha)}
  .tbl.stack td{padding:0;border:0}
  .tbl.stack td.hide-m{display:none}
  .tbl.stack td.full{grid-column:1/-1}
  .tbl.stack tfoot tr{background:#FBF8F5;border-top:2px solid var(--cafe)}
  .tbl.stack tfoot td{border:0;background:none}
}

/* anexo planilha */
.file{display:flex;align-items:center;gap:14px;padding:14px}
.file .xl{width:52px;height:60px;border-radius:6px;background:#E3EDDD;color:#2F6B2A;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;flex:none;border:1px solid #C9DCBF}
.drop{border:2px dashed var(--cafe-claro);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--apagado);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:#FCFAF8}
.drop:hover{border-color:var(--terracota);color:var(--terracota)}
.drop input{display:none}

/* cotações */
.prop{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-top:1px solid var(--linha);align-items:center}
.prop:first-of-type{border-top:0}
.prop.best{background:var(--ok-bg);border-left:6px solid var(--ok);padding-left:10px}
.prop.late{background:#FDF5EA}
.prop .pn{font-size:17px;font-weight:700}
.prop .pt{font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.prop .pd{font-family:var(--mono);font-size:12px;color:var(--apagado);letter-spacing:.03em;text-transform:uppercase}
.prop .why{grid-column:1/-1;margin-top:6px;font-size:14px;font-weight:600}
.prop.best .why{color:var(--ok)} .prop.late .why{color:var(--at-tx)}

/* presença */
.pres-top{display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.pres-top{flex-direction:row;align-items:center}}
.counter{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.counter b{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
.counter span{font-size:16px;color:var(--apagado)}
.emp{padding:12px 14px;border-top:1px solid var(--linha)}
.emp:first-child{border-top:0}
.emp .who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.emp .who b{font-size:17px}
.emp .who span{font-size:14px;color:var(--apagado)}
.emp .who .tag{margin-left:auto}
@media (min-width:900px){.emp{display:grid;grid-template-columns:1fr 440px;align-items:center;gap:16px}.emp .who{margin:0}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts button{min-height:52px;border:1.5px solid var(--linha);border-radius:var(--r);background:var(--branco);font-weight:600;font-size:15px;color:var(--cafe)}
.opts button.on.P{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.on.F{background:var(--cr);border-color:var(--cr);color:#fff}
.opts button.on.A{background:var(--at);border-color:var(--at);color:var(--cafe)}
.opts button.on.FG{background:var(--cafe);border-color:var(--cafe);color:var(--creme)}
.opts.c3{grid-template-columns:repeat(4,1fr)}
.sticky-save{position:sticky;bottom:84px;z-index:5;padding:10px 0 0;background:linear-gradient(transparent,var(--creme) 30%)}
@media (min-width:900px){.sticky-save{bottom:0;padding-bottom:16px}}

/* diário */
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.photos{grid-template-columns:repeat(4,1fr)}}
.ph{aspect-ratio:4/3;border-radius:var(--r);position:relative;overflow:hidden;display:flex;align-items:flex-end;color:#fff}
.ph span{position:relative;z-index:1;font-size:13px;font-weight:600;padding:8px 10px;background:linear-gradient(transparent,rgba(30,20,15,.75));width:100%}
.ph svg{position:absolute;top:10px;right:10px;width:22px;height:22px;opacity:.8}
.ph.add{background:var(--branco);border:2px dashed var(--terracota);color:var(--terracota);align-items:center;justify-content:center;flex-direction:column;gap:6px;font-weight:700;cursor:pointer}
.ph.add svg{position:static;width:34px;height:34px;opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--linha);background:var(--branco);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.on::before{content:"✓";font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field textarea{width:100%;min-height:120px;padding:12px 14px;border:1.5px solid var(--linha);border-radius:var(--r);background:var(--branco);font-size:16px;line-height:1.5;resize:vertical}
.field textarea:focus{outline:none;border-color:var(--terracota);box-shadow:0 0 0 3px #A65A3A22}
.field textarea.edited{border-color:var(--at);background:#FFFBF4}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wx button{min-height:52px;border:1.5px solid var(--linha);border-radius:var(--r);background:var(--branco);font-weight:600;font-size:14px}
.wx button.on{background:var(--cafe);border-color:var(--cafe);color:var(--creme)}
.wx button.on.ch{background:#4A6B87;border-color:#4A6B87}
.stamp{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--apagado);text-transform:uppercase;line-height:1.6}

/* fluxo de caixa */
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:200px;padding:0 4px;border-bottom:2px solid var(--cafe)}
.chart .m{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.chart .m i{width:clamp(14px,4vw,30px);border-radius:3px 3px 0 0;display:block}
.chart .m i.in{background:var(--ok)} .chart .m i.out{background:var(--terracota)}
.chart .m.prev i{opacity:.45}
.chart-l{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 4px 0;text-align:center}
.chart-l b{display:block;font-size:14px}
.chart-l span{font-family:var(--mono);font-size:12px;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* estado vazio */
.empty{padding:44px 20px 40px;text-align:center;display:flex;flex-direction:column;align-items:center}
.empty .ic{width:88px;height:88px;border-radius:50%;background:var(--terra-bg);display:grid;place-items:center;color:var(--terracota);margin-bottom:18px}
.empty .ic svg.i{width:42px;height:42px;stroke-width:1.6}
.empty h2{font-size:21px;font-weight:700;margin-bottom:8px}
.empty p{font-size:16px;color:var(--apagado);max-width:380px;margin-bottom:22px}

/* folha de baixo + aviso */
.veil{position:fixed;inset:0;background:rgba(59,42,34,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--creme);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:12px}}
.sheet h3{font-size:20px;margin-bottom:4px}
.msg{background:#E7F2DD;border-radius:10px 10px 10px 2px;padding:14px;font-size:15px;white-space:pre-wrap;margin:14px 0 16px;border:1px solid #CFE2BF}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%) translateY(20px);background:var(--cafe);color:var(--creme);padding:14px 20px;border-radius:var(--r);
  font-weight:600;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:900px){.toast{bottom:32px;left:calc(50% + 120px)}}

.soon{padding:28px 18px;text-align:center;color:var(--apagado)}
.soon b{display:block;color:var(--cafe);font-size:18px;margin-bottom:6px}
</style>
</head>

/* ---------- 5. Cotações (o sistema indica a melhor compra) ---------- */
function analisar(c){
  const ps = c.props.map(p=>({...p, total:p.un*p.n+p.frete, noPrazo:p.chega<=c.limite}));
  const ok = ps.filter(p=>p.noPrazo).sort((a,b)=>a.total-b.total);
  const best = ok[0], barata = [...ps].sort((a,b)=>a.total-b.total)[0];
  const cara = Math.max(...ps.map(p=>p.total));
  return {ps:[best, ...ps.filter(p=>p!==best).sort((a,b)=>a.total-b.total)], best, barata, eco:cara-best.total};
}
function abaCotacoes(){
  const an = COT.map(analisar), eco = an.reduce((s,a)=>s+a.eco,0);
  return `
  <div class="kpis k3">
    <div class="card kpi t"><div class="lab">Cotações abertas</div><span class="n">${COT.length}</span><div class="d">${COT.reduce((s,c)=>s+c.props.length,0)} propostas</div></div>
    <div class="card kpi ok"><div class="lab">Economia</div><span class="n g"><small>R$</small>${mil(eco)}</span><div class="d">contra a proposta mais cara</div></div>
    <div class="card kpi"><div class="lab">Como escolho</div><span class="n" style="font-size:20px;white-space:normal;line-height:1.25">Menor total com frete, que chega no prazo</span></div>
  </div>
  <div class="sec-h"><span class="lab">Escola Vila Nova</span><button class="btn pri sm" onclick="toast('Abriria nova cotação: item, quantidade, prazo e fornecedores.')">${ic('plus')}Nova cotação</button></div>
  <div class="grid2">
  ${COT.map((c,ci)=>{ const a=an[ci]; return `
    <div class="card">
      <div class="list-h"><div><div class="nm">${c.item}</div><div class="lab" style="margin-top:2px">${c.qtd} · precisa até ${c.para}</div></div><span class="tag at" style="margin-left:auto">${c.status}</span></div>
      ${a.ps.map(p=>{
        const isBest = p===a.best, late = !p.noPrazo;
        const why = isBest ? (a.barata!==p ? `Melhor opção: a mais barata que chega até ${c.para}` : 'Melhor opção: menor preço e chega no prazo')
                  : late ? `Mais barata, mas chega ${p.chega}/11 — depois do prazo` : `R$ ${(p.total-a.best.total).toLocaleString('pt-BR',{minimumFractionDigits:2})} mais cara`;
        return `<div class="prop ${isBest?'best':late?'late':''}">
          <div><div class="pn">${p.f}</div><div class="pd">${brl(p.un)}/un · frete ${p.frete?brl(p.frete):'grátis'} · chega ${p.chega}/11 · ${p.cond}</div></div>
          <div class="pt">${brl(p.total)}</div>
          <div class="why">${isBest?'★ ':late?'⚠ ':''}${why}</div></div>`;}).join('')}
      <div class="list-f btns">
        <button class="btn okb" style="flex:1" onclick="toast('Geraria a compra com ${a.best.f}: ${brl(a.best.total)}, entra como Aguardando NF.')">${ic('check')}Comprar de ${a.best.f.split(' ')[0]} ${a.best.f.split(' ')[1]||''}</button>
        <button class="btn wa sm" onclick="toast('Abriria o WhatsApp pedindo preço aos fornecedores.')">${ic('wa')}Pedir preço</button>
      </div>
    </div>`;}).join('')}
  </div>`;
}

function telaNotas(){

  <div class="ct">${telaNotasCorpo()}</div>`;

function telaNotasCorpo(){
  const obras = ['Todas', ...new Set(PEND.map(p=>p.obra))];
  const itens = PEND.filter(p=>S.filtroObra==='Todas'||p.obra===S.filtroObra);
  const grupos = {}; itens.forEach(p=>(grupos[p.forn] ||= []).push(p));
  const ord = Object.entries(grupos).sort((a,b)=>Math.max(...b[1].map(x=>x.dias))-Math.max(...a[1].map(x=>x.dias)));
  const total = itens.reduce((s,p)=>s+p.valor,0), atras = itens.filter(p=>p.dias>7).length;
  return `
    <div class="kpis">
      <div class="card kpi ${atras?'cr':'at'}"><div class="lab">Compras sem NF</div><span class="n">${itens.length}</span><div class="d">${atras?atras+' há mais de 7 dias':'todas no prazo'}</div></div>
      <div class="card kpi t"><div class="lab">Valor sem NF</div><span class="n"><small>R$</small>${mil(total)}</span><div class="d">${ord.length} fornecedores</div></div>
    </div>
    ${S.tela==='notas'?`<div class="seg">${obras.map(o=>`<button class="${S.filtroObra===o?'on':''}" onclick="S.filtroObra='${o}';render()">${o}</button>`).join('')}</div>`:''}
    <div class="grid2">
    ${ord.map(([f,ps])=>{
      const t = ps.reduce((s,p)=>s+p.valor,0), pior = Math.max(...ps.map(p=>p.dias)), no = new Set(ps.map(p=>p.obra)).size;
      return `<div class="card list">
        <div class="list-h"><div><div class="nm">${f}</div><div class="lab" style="margin-top:2px">${ps.length} ${ps.length>1?'compras':'compra'} · ${no} obra${no>1?'s':''}</div></div>
          <div class="tot"><b>${brl(t)}</b>${pior>7?'<span class="tag cr">atrasada</span>':pior>=5?'<span class="tag at">atenção</span>':'<span class="tag ok">no prazo</span>'}</div></div>
        ${ps.sort((a,b)=>b.dias-a.dias).map(p=>rowPend(p,true)).join('')}
        <div class="list-f" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="btn wa" onclick="cobrar('${f}')">${ic('wa')}Cobrar NF</button>
          <button class="btn sec" onclick="toast('Abriria a câmera para anexar a NF.')">${ic('clip')}Anexar NF</button>
        </div></div>`;}).join('')}
    </div>`;
}

/* ======================== FOLHA DE BAIXO / AVISO ======================== */
function sheet(h){ document.getElementById('sheet').innerHTML=h; document.getElementById('veil').classList.add('on'); }
function closeSheet(){ document.getElementById('veil').classList.remove('on'); }
function cobrar(f){
  const ps = PEND.filter(p=>p.forn===f), porObra = {};
  ps.forEach(p=>(porObra[p.obra] ||= []).push(p));
  let msg = `Olá, ${f}! Aqui é o Wlisses, engenheiro das obras.\nEstamos sem a nota fiscal destas compras:\n`;
  Object.entries(porObra).forEach(([o,l])=>{ msg += `\n${o}\n` + l.map(p=>`• ${p.data} – ${p.desc} – ${brl(p.valor)}`).join('\n') + '\n'; });
  msg += `\nTotal: ${brl(ps.reduce((s,p)=>s+p.valor,0))}\nPode enviar a NF por aqui? Obrigado!`;
  sheet(`<div class="lab">Cobrar NF no WhatsApp</div><h3>${f}</h3><div class="msg">${msg}</div>
    <div class="acts"><button class="btn sec" onclick="closeSheet()">Cancelar</button>
    <button class="btn pri" onclick="closeSheet();toast('No app de verdade, abre o WhatsApp com essa mensagem.')">${ic('wa')}Abrir WhatsApp</button></div>`);
}
let tt;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2600); }

render();
</script>
